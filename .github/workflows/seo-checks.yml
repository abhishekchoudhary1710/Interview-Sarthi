name: SEO checks
on:
  pull_request:
  push:
    branches: [main, 'seo-geo-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_apply_pages.py --check
      - run: python scripts/generate_sitemap.py --check
      - run: python scripts/seo_audit.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/analytics.test.cjs
      - run: node --test tests/mock_engine.test.mjs
